[project]
name = "trening-polski-tts"
version = "0.1.0"
description = "Trening polskiego TTS: kodek 48 kHz, model tekst->latenty i predyktor długości (kod z BlueTTS i blue-codec, MIT)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "soundfile",
    "pandas",
    "tqdm",
    "tensorboard",
    "safetensors",
    "huggingface-hub",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
